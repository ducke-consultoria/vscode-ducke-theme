name: Publish to Open VSX Registry

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4.1.4

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Install OVSE
        run: npm install -g ovsx

      - name: Get the version
        id: get_version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Package Extension
        run: npx ovsx package

      - name: Publish to Open VSX Registry
        run: npx ovsx publish --pat ${{ secrets.OPEN_VSX_TOKEN }}

  notify:
    name: Discord Notification
    permissions: write-all
    runs-on: ubuntu-latest
    needs:
      - publish
    if: ${{ always() }}
    steps:
      - name: Notify
        uses: nobrayner/discord-webhook@v1
        with:
          github-token: ${{ secrets.github_token }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          description: |
            Open VSX Build #${{ github.run_number }}
            ```Ducke Theme: ${{ needs.publish.outputs.version }}```
            Published to Open VSX Registry
